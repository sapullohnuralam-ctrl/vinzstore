<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINZSTORE - Top Up Game & Gaming Marketplace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #131c2e;
            --accent-green: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Header & Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-green);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .auth-btn {
            background: transparent;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .auth-btn:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1a2c42 0%, var(--bg-dark) 70%);
            margin-top: 70px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--accent-green);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .cta-btn {
            background: var(--accent-green);
            color: var(--bg-dark);
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.3s;
        }

        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent-green);
        }

        /* Games Grid Section */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            border-left: 4px solid var(--accent-green);
            padding-left: 15px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            position: container;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-green);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.2);
        }

        .game-banner {
            height: 160px;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: var(--accent-green);
            background-size: cover;
            background-position: center;
        }

        .game-info {
            padding: 20px;
        }

        .game-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .game-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Interactive Calculator Simulation */
        .calculator-section {
            background: linear-gradient(135deg, #131c2e, #0b0f19);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin-top: 40px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media(max-width: 768px) {
            .calc-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 32px; }
            nav ul { display: none; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .nominal-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .nominal-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nominal-btn.active, .nominal-btn:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .checkout-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .total-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-green);
            margin: 15px 0;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #070a12;
            color: var
